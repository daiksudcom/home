name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to redeploy; defaults to the current main revision
        required: false
        type: string

# A single workflow performs the version check, the tag, and the deploy because pushes made
# with GITHUB_TOKEN never start another workflow run, so a separate tag workflow could not
# trigger this one without introducing a personal access token.
concurrency:
  group: home-production
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  disabled:
    name: Deployment gate
    if: vars.DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - run: echo 'DEPLOY_ENABLED is not true; no production revision was changed.'

  deploy:
    name: Tag and deploy
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 20
    environment: production
    permissions:
      contents: write
      deployments: write
    env:
      TARGET_SHA: ${{ inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha || github.sha }}
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          run_install: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Verify the revision is contained in main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - name: Resolve the tag for this revision
        id: tag
        run: |
          set -euo pipefail
          resolved=$(node .github/scripts/policy.mjs revision "$TARGET_SHA")
          printf 'tag=%s\n' "$(jq -r .tag <<<"$resolved")" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$(jq -r .version <<<"$resolved")" >> "$GITHUB_OUTPUT"
          printf 'core-changed=%s\n' "$(jq -r .coreChanged <<<"$resolved")" >> "$GITHUB_OUTPUT"
      # An annotated tag object requires a tagger identity; the runner has no default git
      # user, so `git tag --annotate` below would otherwise fail with "unable to
      # auto-detect email address".
      - name: Configure git identity for the release tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      # The build identifier is derived from the commit, so a retried run resolves the same
      # tag name and this step becomes a no-op instead of creating a second tag.
      - name: Create the tag when it does not exist yet
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          existing=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [[ -n "$existing" ]]; then
            if [[ "$(git rev-parse "${existing}^{commit}")" != "$TARGET_SHA" ]]; then
              printf 'Tag %s already points elsewhere; refusing to move it.\n' "$TAG" >&2
              exit 1
            fi
            printf 'Tag %s already exists for this revision; continuing the interrupted deploy.\n' "$TAG"
            exit 0
          fi
          git tag --annotate "$TAG" --message "$TAG" "$TARGET_SHA"
          git push origin "refs/tags/$TAG"
      - name: Upload, smoke, and deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
          DEPLOY_TAG: ${{ steps.tag.outputs.tag }}
          GITHUB_SHA: ${{ inputs.sha || github.sha }}
          DEPLOYMENT_RECEIPT_PATH: ${{ runner.temp }}/deployment-receipt.json
          WRANGLER_SEND_METRICS: 'false'
        run: node .github/scripts/deploy-worker.mjs
      - name: Preserve the deployment receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-${{ steps.tag.outputs.tag }}
          path: ${{ runner.temp }}/deployment-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Record the successful production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ inputs.sha || github.sha }}
          PRODUCTION_ORIGIN: ${{ vars.PRODUCTION_ORIGIN }}
          DEPLOYMENT_RECEIPT_PATH: ${{ runner.temp }}/deployment-receipt.json
        run: node .github/scripts/record-deployment.mjs
      # A build identifier marks a redeploy of unchanged capability, so it never becomes a
      # GitHub Release. Product Release happens in the flags repository either way.
      - name: Publish the version record
        if: steps.tag.outputs.core-changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            printf 'GitHub Release %s already exists; continuing the interrupted deploy.\n' "$TAG"
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
      - name: Confirm the latest tag matches production
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/drift-check.mjs
